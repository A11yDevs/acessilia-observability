services:
  panel:
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      AGENTOS_TOKEN: ${AGENTOS_TOKEN:-}
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "${HUB_BIND_IP:-127.0.0.1}:9090:9090"
    volumes:
      - ./stack/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${HUB_BIND_IP:-127.0.0.1}:3100:3100"
    volumes:
      - ./stack/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command: -config.file=/etc/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"
      - "${HUB_BIND_IP:-127.0.0.1}:4318:4318"
    volumes:
      - ./stack/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

