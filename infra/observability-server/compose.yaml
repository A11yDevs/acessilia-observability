name: acessilia-observability

services:
  panel:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      AGENTOS_TOKEN: ${AGENTOS_TOKEN:-}
      OBS_VIEW_TOKEN: ${OBS_VIEW_TOKEN:?Set a separate viewer token in .env}
      OBS_INGEST_TOKEN: ${OBS_INGEST_TOKEN:?Set an event ingestion token in .env}
      OBS_HOST_TOKEN: ${OBS_HOST_TOKEN:?Set a separate host ingestion token in .env}
      ACESSILIA_API_URL: ${ACESSILIA_API_URL:-}
      ACESSILIA_OBSERVABILITY_TOKEN: ${ACESSILIA_OBSERVABILITY_TOKEN:-}
      TOOLBOX_API_URL: ${TOOLBOX_API_URL:-}
      TOOLBOX_API_KEY: ${TOOLBOX_API_KEY:-}
      AGENTOS_URL: ${AGENTOS_URL:-}
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:-develop}
      OBS_RETENTION_DAYS: ${OBS_RETENTION_DAYS:-7}
      OBS_MAX_EVENTS: ${OBS_MAX_EVENTS:-100000}
      OBS_ENABLE_TEST_CONSOLE: ${OBS_ENABLE_TEST_CONSOLE:-false}
      OBS_DB_PATH: /app/var/observability.sqlite3
    volumes:
      - observation-data:/app/var
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command: -config.file=/etc/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:4318:4318"
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  observation-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
