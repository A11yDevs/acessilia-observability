[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agno-observability-kit"
version = "0.1.0"
description = "Standalone observability hub for Agno AgentOS applications"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agno_observability_kit*"]
