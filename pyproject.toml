[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acessilia-observability"
version = "0.1.0"
description = "Correlated job, decision and host observability for Acessilia and Acessilia Toolbox"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
host = ["psutil>=6,<8"]
telemetry = [
  "agno>=3",
  "openinference-instrumentation-agno",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agno_observability_kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
